name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore server/RajendraGlass.Api.csproj
          dotnet restore tests/RajendraGlass.Tests/RajendraGlass.Tests.csproj

      - name: Build API
        run: dotnet build server/RajendraGlass.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/RajendraGlass.Tests/RajendraGlass.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes TypeScript check)
        run: npm run build
